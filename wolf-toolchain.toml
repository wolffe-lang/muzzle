# muzzle: the pinned toolchain.
#
# wolf comes from its RELEASE ARCHIVE, pinned by sha256 digest, never
# from a source build. `tools/fetch-toolchain` downloads the archive for
# this host, refuses on a digest mismatch, and stages it whole into
# `.wolf-bin/` (gitignored). Identity is the first line of
# `wolf --version`, checked against `version_line`.
#
# muzzle builds on x86_64-unknown-none (the freestanding target) from an
# x86-64 Linux host; the archive's libwolf_rt.a is never linked
# (README, design rule 1). lupin is not pinned: it has no C membrane,
# no assembly and no freestanding target, so it can answer nothing here.

# ## The pin: 0.2.35 (r40p, 2026-10-23)
#
# The linux x86-64 digest was read twice from wolf-lang release 421613621
# and compared with r40's published evidence. v0.2.35 names commit
# cf0c13d; the freestanding target remains muzzle's only build target.

# ## The pin: 0.2.36 (r41p, 2026-10-31)
#
# The linux x86-64 digest was read twice from wolf-lang release 427033151
# and compared with r41's published evidence; the archive was hashed twice
# after download on hasu. v0.2.36 names commit 5adf3d9. It carries C
# variadics in both directions on x86_64-unknown-none (wolf-lang#515), so
# the printf family can now be written; that is lc02's (stdio). muzzle
# declares no variadic yet, and this pin moves no case.

# ## The pin: 0.2.41 (2026-11-27)
#
# The linux x86-64 digest was read from wolf-lang release 458496472 and
# equals the release's own digest; the archive was hashed twice after
# download. v0.2.41 names commit 0261597. Its freestanding runtime reaches
# the ambient region through weak wolf_ambient_load and wolf_ambient_store;
# muzzle allocates no region and links no runtime archive, so it imports
# neither. Function placement changes the objects' bytes, and no case moves.

[wolf]
version = "0.2.41"
repo = "wolffe-lang/wolf-lang"
rev = "0261597230b46f17f7a894c5558452c19fa31b96"
version_line = "wolf 0.2.41 (wolfgang, pin 0261597)"
x86_64-unknown-linux-gnu = "e7ec4cde06db2f2235ae82e3dff1db06f6b8e37249c883a3a35bdee8c86b8c34"
